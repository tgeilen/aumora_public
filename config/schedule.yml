# Sidekiq-cron schedule configuration
# Format: 'name': { 'cron': 'cron_expression', 'class': 'JobClassName' }

# Keep-alive job - runs every 25 minutes to prevent Eco dyno from sleeping
keep_alive:
  cron: '*/25 * * * *'
  class: 'KeepAliveJob'
  description: 'Keep worker dyno awake (runs every 25 minutes)'


# ETF sync job - runs daily at 6 AM UTC (adjust timezone as needed)
etf_sync_daily:
  cron: '0 4 * * *'
  class: 'ScheduledEtfSyncJob'
  description: 'Daily ETF composition sync from iShares'

